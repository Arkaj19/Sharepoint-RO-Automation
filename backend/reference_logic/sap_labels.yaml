# Seed for the mapping dictionaries. The importer (app/importers) checks every
# entry against the real extract headers, verifies it against the S/4 output
# where the field is passed through, and fills fields not listed here by value
# matching. Entries end up in each mapping's `dictionary` through a G1
# operation, so they are reviewed like any other mapping change.
