raw_condition_notes: |-
  INNER CONDITION:

  • MARC.LVORM IS NULL
  • MARC.WERKS = '1021'
  • MARC.LVORM IS NULL
  • MARC.WERKS = '1021'

  • MBEW.LVORM IS NULL
  • MARA.LVORM IS NULL
  • MBEW.MATNR IN (
      SELECT DISTINCT MATNR
      FROM con_dev.silver_sap.mara_dap
      WHERE MTART <> 'UNBW'
        AND LVORM IS NULL
    )
  • base.DERIVED_WERKS <> '1021'
  • MBEW.BWKEY = '1021'

  OUTER CONDITION:

  • No Outer WHERE Condition
